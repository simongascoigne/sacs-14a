<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SACS 14A" />
  <title>SACS 14A Basketball • Fixtures & Ladder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

  <!-- SACS Branded Header -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-sky-900/50 px-4 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-sky-500 text-slate-950 font-black flex items-center justify-center text-sm tracking-tighter shadow-lg shadow-sky-500/20">
        14A
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight text-white">St Andrew's 14A</h1>
        <p id="syncStatus" class="text-[11px] text-sky-400">ISA 14s Div 2 • Auto-Synced</p>
      </div>
    </div>
    <button onclick="shareNextGameToWhatsApp()" class="px-3 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 shadow-md">
      <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
      <span>WhatsApp</span>
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- Top View Switcher: SACS 14A Draw vs Division 2 Ladder -->
    <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
      <button onclick="switchMainTab('draw')" id="main-tab-draw" class="py-2 rounded-lg bg-sky-500 text-slate-950 flex items-center justify-center gap-1.5 shadow">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i> SACS 14A Draw
      </button>
      <button onclick="switchMainTab('ladder')" id="main-tab-ladder" class="py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
        <i data-lucide="trophy" class="w-3.5 h-3.5"></i> Div 2 Ladder
      </button>
    </div>

    <!-- TAB 1: SACS 14A DRAW & NEXT GAME -->
    <div id="view-draw" class="space-y-5">
      <!-- Season Record Summary Bar -->
      <section id="recordSummary" class="grid grid-cols-3 gap-2"></section>

      <!-- NEXT GAME HERO CARD -->
      <section id="nextGameHero"></section>

      <!-- FULL SEASON DRAW & RESULTS -->
      <section class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Season Draw & Results</h2>
          <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs">
            <button onclick="setFilter('all')" id="btn-all" class="px-2.5 py-1 rounded-md bg-sky-500 text-slate-950 font-bold">All</button>
            <button onclick="setFilter('upcoming')" id="btn-upcoming" class="px-2.5 py-1 rounded-md text-slate-400 font-medium">Upcoming</button>
            <button onclick="setFilter('results')" id="btn-results" class="px-2.5 py-1 rounded-md text-slate-400 font-medium">Results</button>
          </div>
        </div>

        <div id="fixturesContainer" class="space-y-3"></div>
      </section>
    </div>

    <!-- TAB 2: 14s DIVISION 2 STANDINGS TABLE -->
    <div id="view-ladder" class="hidden space-y-5">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="px-4 py-3 bg-slate-950/60 border-b border-slate-800 flex items-center justify-between">
          <div>
            <h2 class="text-xs font-bold uppercase tracking-wider text-white">14s Division 2 Ladder</h2>
            <p class="text-[11px] text-slate-400">Calculated from completed division games (W=3, D=2, L=1)</p>
          </div>
          <button onclick="shareLadderToWhatsApp()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-[11px] flex items-center gap-1 border border-slate-700">
            <i data-lucide="share-2" class="w-3 h-3"></i> Share
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950/40 text-slate-400 text-[10px] uppercase border-b border-slate-800">
              <tr>
                <th class="py-2.5 pl-3">#</th>
                <th class="py-2.5">Team</th>
                <th class="py-2.5 text-center">P</th>
                <th class="py-2.5 text-center">W</th>
                <th class="py-2.5 text-center">L</th>
                <th class="py-2.5 text-center">F/A</th>
                <th class="py-2.5 text-center">+/-</th>
                <th class="py-2.5 pr-3 text-right">PTS</th>
              </tr>
            </thead>
            <tbody id="ladderTableBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>

      <!-- Other Division 2 Results by Round -->
      <div class="space-y-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">All 14s Division 2 Match Results</h3>
        <div id="allDivMatchesContainer" class="space-y-2.5"></div>
      </div>
    </div>

    <!-- Footer Link to Official Clipboard -->
    <footer class="pt-4 text-center flex items-center justify-center gap-4">
      <a href="https://fixtures.clipboard.app/isa/fixtures?associationSeasonId=e94f3fa0-158f-11f0-ac93-6bf44416c9ad&associationActivityGradeIds=%5B%22711aa164-d787-11ef-bde6-6911b959edfa%22%5D&organisationIds=%5B472%5D&competitionGroupIds=%5B%222bc0fd94-8c12-4bad-ad4f-50585f703c0b%22%5D&round=_all" target="_blank" class="text-xs text-slate-500 hover:text-sky-400 inline-flex items-center gap-1">
        <span>Official ISA Fixtures</span>
        <i data-lucide="external-link" class="w-3 h-3"></i>
      </a>
      <span class="text-slate-700">•</span>
      <a href="https://fixtures.clipboard.app/isa/ladder?associationSeasonId=e94f3fa0-158f-11f0-ac93-6bf44416c9ad&associationActivityGradeIds=%5B%22711aa164-d787-11ef-bde6-6911b959edfa%22%5D&competitionGroupIds=%5B%222bc0fd94-8c12-4bad-ad4f-50585f703c0b%22%5D" target="_blank" class="text-xs text-slate-500 hover:text-sky-400 inline-flex items-center gap-1">
        <span>Official ISA Ladder</span>
        <i data-lucide="external-link" class="w-3 h-3"></i>
      </a>
    </footer>

  </main>

  <script>
    let currentFilter = 'all';
    let allDivisionFixtures = []; // Every match in 14s Div 2
    let sacsFixtures = [];        // Filtered strictly to St Andrew's 14A
    let currentLadder = [];

    function switchMainTab(tab) {
      const isDraw = tab === 'draw';
      document.getElementById('view-draw').classList.toggle('hidden', !isDraw);
      document.getElementById('view-ladder').classList.toggle('hidden', isDraw);

      document.getElementById('main-tab-draw').className = isDraw
        ? 'py-2 rounded-lg bg-sky-500 text-slate-950 flex items-center justify-center gap-1.5 shadow'
        : 'py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5';

      document.getElementById('main-tab-ladder').className = !isDraw
        ? 'py-2 rounded-lg bg-sky-500 text-slate-950 flex items-center justify-center gap-1.5 shadow'
        : 'py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
    }

    function parseDomFallback(domArray) {
      if (!Array.isArray(domArray)) return [];
      const parsed = [];
      const seenKeys = new Set();

      domArray.forEach(block => {
        if (!block || !block.startsWith('Round ')) return;
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);

        const round = lines[0];
        const vsIdx = lines.indexOf('vs');
        const calIdx = lines.indexOf('calendar_today');
        const locIdx = lines.indexOf('location_on');

        if (vsIdx === -1 || calIdx === -1) return;

        const homeSchool = lines[3] || 'Home';
        const homeTeamCode = (lines[5] || '').replace(/\s+/g, '');
        const homeTeam = `${homeSchool} ${homeTeamCode}`.trim();

        const awaySchool = lines[vsIdx + 1] || 'Away';
        const awayTeamCode = (lines[vsIdx + 3] || '').replace(/\s+/g, '');
        const awayTeam = `${awaySchool} ${awayTeamCode}`.trim();

        // Deduplicate rows if DOM matched both tr and inner row
        const uniqueKey = `${round}_${homeTeam}_${awayTeam}`;
        if (seenKeys.has(uniqueKey)) return;
        seenKeys.add(uniqueKey);

        const resultLines = lines.slice(vsIdx + 4, calIdx);
        const scoreLine = resultLines[0] || '-';
        const outcomeText = (resultLines[1] || '').toLowerCase();

        let homeScore = null;
        let awayScore = null;
        let status = 'UPCOMING';
        let winner = null; // 'HOME', 'AWAY', 'DRAW'

        const scoreMatch = scoreLine.match(/^(\d+)\s*-\s*(\d+)$/);
        if (scoreMatch) {
          const n1 = parseInt(scoreMatch[1], 10);
          const n2 = parseInt(scoreMatch[2], 10);
          const high = Math.max(n1, n2);
          const low = Math.min(n1, n2);
          status = 'COMPLETED';

          if (n1 === n2 || outcomeText.includes('draw') || outcomeText.includes('tie')) {
            homeScore = n1;
            awayScore = n2;
            winner = 'DRAW';
          } else if (outcomeText.includes('wins')) {
            const homeWon = outcomeText.includes(homeSchool.toLowerCase());
            const awayWon = outcomeText.includes(awaySchool.toLowerCase());
            if (homeWon) {
              homeScore = high;
              awayScore = low;
              winner = 'HOME';
            } else if (awayWon) {
              homeScore = low;
              awayScore = high;
              winner = 'AWAY';
            }
          } else {
            homeScore = n1;
            awayScore = n2;
            winner = homeScore > awayScore ? 'HOME' : 'AWAY';
          }
        }

        const sacsIsHome = homeSchool.toLowerCase().includes('andrew');
        const sacsIsAway = awaySchool.toLowerCase().includes('andrew');
        let sacsResult = null;
        if (status === 'COMPLETED' && (sacsIsHome || sacsIsAway)) {
          if (winner === 'DRAW') sacsResult = 'DRAW';
          else if ((sacsIsHome && winner === 'HOME') || (sacsIsAway && winner === 'AWAY')) sacsResult = 'WIN';
          else sacsResult = 'LOSS';
        }

        const dateStr = lines[calIdx + 1] || '';
        const rawTimeStr = lines[calIdx + 2] || '';
        const timeStr = rawTimeStr === '2:34am' ? 'Time TBA' : rawTimeStr;

        let court = 'Venue TBA';
        let address = '';
        if (locIdx !== -1) {
          const locLines = lines.slice(locIdx + 1);
          if (locLines[0] && locLines[0] !== '-') {
            court = locLines[0];
            if (locLines.length === 2) address = locLines[1];
            else if (locLines.length >= 3) address = locLines.slice(2).join(', ');
          }
        }

        parsed.push({
          round,
          homeSchool,
          awaySchool,
          homeTeam,
          awayTeam,
          homeScore,
          awayScore,
          winner,
          sacsResult,
          outcomeLabel: resultLines[1] || '',
          status,
          dateStr,
          timeStr,
          court,
          address,
          isSacsGame: sacsIsHome || sacsIsAway
        });
      });

      return parsed;
    }

    function buildLadder(matches) {
      const teams = {};

      matches.forEach(m => {
        if (!teams[m.homeTeam]) teams[m.homeTeam] = { name: m.homeTeam, p: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0, diff: 0, pts: 0 };
        if (!teams[m.awayTeam]) teams[m.awayTeam] = { name: m.awayTeam, p: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0, diff: 0, pts: 0 };

        if (m.status === 'COMPLETED' && m.homeScore !== null && m.awayScore !== null) {
          const h = teams[m.homeTeam];
          const a = teams[m.awayTeam];

          h.p++; a.p++;
          h.pf += m.homeScore; h.pa += m.awayScore; h.diff = h.pf - h.pa;
          a.pf += m.awayScore; a.pa += m.homeScore; a.diff = a.pf - a.pa;

          if (m.winner === 'HOME') {
            h.w++; h.pts += 3;
            a.l++; a.pts += 1;
          } else if (m.winner === 'AWAY') {
            a.w++; a.pts += 3;
            h.l++; h.pts += 1;
          } else {
            h.d++; h.pts += 2;
            a.d++; a.pts += 2;
          }
        }
      });

      return Object.values(teams).sort((a, b) => b.pts - a.pts || b.diff - a.diff || b.pf - a.pf || a.name.localeCompare(b.name));
    }

    function getMapsUrl(court, address) {
      const query = address || (court !== 'Venue TBA' ? `${court} NSW` : 'Sydney NSW');
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    async function loadData() {
      try {
        const res = await fetch('./sacs-14a.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.updatedAt) {
            const dt = new Date(data.updatedAt);
            document.getElementById('syncStatus').innerText = `Updated ${dt.toLocaleDateString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
          }
          if (data.domFallback) {
            allDivisionFixtures = parseDomFallback(data.domFallback);
            sacsFixtures = allDivisionFixtures.filter(f => f.isSacsGame);
            currentLadder = buildLadder(allDivisionFixtures);
          }
        }
      } catch (e) {
        console.error('Error loading sacs-14a.json:', e);
      }
      render();
    }

    function getNextGame() {
      return sacsFixtures.find(f => f.status !== 'COMPLETED') || sacsFixtures[sacsFixtures.length - 1];
    }

    function formatWhatsAppText(game) {
      const mapsLink = getMapsUrl(game.court, game.address);
      const appUrl = window.location.href.split('?')[0];

      if (game.status === 'COMPLETED') {
        return `🏀 *SACS 14A Result (${game.round})*\n*${game.homeTeam}* ${game.homeScore} – ${game.awayScore} *${game.awayTeam}*\n(${game.outcomeLabel})\n\n📅 Full draw & Div 2 Ladder:\n${appUrl}`;
      }

      let locText = `📍 *Court:* ${game.court}`;
      if (game.address) {
        locText += `\n🗺️ *Address:* ${game.address}\n🚗 *Directions:* ${mapsLink}`;
      }

      return `🏀 *SACS 14A Basketball – ${game.round}*\n📅 *Sat ${game.dateStr} @ ${game.timeStr}*\n🆚 ${game.homeTeam} vs ${game.awayTeam}\n${locText}\n\n🔗 *Live Draw & Ladder:* ${appUrl}`;
    }

    function shareGameToWhatsApp(idx) {
      const game = sacsFixtures[idx];
      if (!game) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(formatWhatsAppText(game))}`, '_blank');
    }

    function shareNextGameToWhatsApp() {
      const next = getNextGame();
      if (!next) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(formatWhatsAppText(next))}`, '_blank');
    }

    function shareLadderToWhatsApp() {
      const appUrl = window.location.href.split('?')[0];
      const lines = currentLadder.map((t, i) => `${i + 1}. *${t.name}* — ${t.pts}pts (${t.w}W-${t.l}L, ${t.diff >= 0 ? '+' + t.diff : t.diff})`);
      const text = `🏆 *ISA 14s Division 2 Standings*\n\n${lines.join('\n')}\n\n🔗 *Full Draw & Results:* ${appUrl}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function setFilter(f) {
      currentFilter = f;
      ['all', 'upcoming', 'results'].forEach(k => {
        const btn = document.getElementById('btn-' + k);
        btn.className = k === f
          ? 'px-2.5 py-1 rounded-md bg-sky-500 text-slate-950 font-bold'
          : 'px-2.5 py-1 rounded-md text-slate-400 font-medium';
      });
      render();
    }

    function render() {
      // 1. Season Record Summary
      let wins = 0, losses = 0, played = 0;
      sacsFixtures.forEach(f => {
        if (f.status === 'COMPLETED') {
          played++;
          if (f.sacsResult === 'WIN') wins++;
          else if (f.sacsResult === 'LOSS') losses++;
        }
      });

      document.getElementById('recordSummary').innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-slate-400 font-semibold">Played</p>
          <p class="text-lg font-black text-white">${played}</p>
        </div>
        <div class="bg-slate-900 border border-emerald-500/20 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-emerald-400 font-semibold">Won</p>
          <p class="text-lg font-black text-emerald-400">${wins}</p>
        </div>
        <div class="bg-slate-900 border border-rose-500/20 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-rose-400 font-semibold">Lost</p>
          <p class="text-lg font-black text-rose-400">${losses}</p>
        </div>
      `;

      // 2. Next Game Hero Card
      const next = getNextGame();
      const hero = document.getElementById('nextGameHero');

      if (next) {
        const sacsIsHome = next.homeTeam.toLowerCase().includes('andrew');
        hero.innerHTML = `
          <div class="rounded-2xl bg-gradient-to-br from-sky-500/20 via-slate-900 to-slate-900 border border-sky-500/40 p-4 shadow-xl space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-sky-400 text-slate-950 uppercase tracking-wide">
                Next Game • ${next.round}
              </span>
              <span class="text-xs font-bold text-sky-300">Sat ${next.dateStr} • ${next.timeStr}</span>
            </div>

            <div class="grid grid-cols-7 items-center text-center py-1">
              <div class="col-span-3">
                <p class="font-bold text-sm sm:text-base ${sacsIsHome ? 'text-sky-400' : 'text-white'} leading-snug">${next.homeTeam}</p>
                <span class="text-[10px] text-slate-400 uppercase">Home</span>
              </div>
              <div class="col-span-1 text-xs font-black text-slate-500">VS</div>
              <div class="col-span-3">
                <p class="font-bold text-sm sm:text-base ${!sacsIsHome ? 'text-sky-400' : 'text-white'} leading-snug">${next.awayTeam}</p>
                <span class="text-[10px] text-slate-400 uppercase">Away</span>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/90 space-y-3">
              <div class="flex items-start gap-2 text-xs">
                <i data-lucide="map-pin" class="w-4 h-4 text-sky-400 shrink-0 mt-0.5"></i>
                <div>
                  <p class="font-semibold text-white">${next.court}</p>
                  ${next.address ? `<p class="text-[11px] text-slate-400">${next.address}</p>` : ''}
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <a href="${getMapsUrl(next.court, next.address)}" target="_blank" class="py-2.5 px-3 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-1.5">
                  <i data-lucide="navigation" class="w-3.5 h-3.5"></i> Open in Maps
                </a>
                <button onclick="shareNextGameToWhatsApp()" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold text-xs flex items-center justify-center gap-1.5 border border-slate-700">
                  <i data-lucide="share-2" class="w-3.5 h-3.5"></i> Share to Chat
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 3. SACS 14A Season List
      const listContainer = document.getElementById('fixturesContainer');
      const filtered = sacsFixtures.map((f, idx) => ({ ...f, idx })).filter(f => {
        if (currentFilter === 'upcoming') return f.status !== 'COMPLETED';
        if (currentFilter === 'results') return f.status === 'COMPLETED';
        return true;
      });

      listContainer.innerHTML = filtered.map(f => {
        const isDone = f.status === 'COMPLETED';
        const sacsIsHome = f.homeTeam.toLowerCase().includes('andrew');
        const sacsScore = sacsIsHome ? f.homeScore : f.awayScore;
        const oppScore = sacsIsHome ? f.awayScore : f.homeScore;

        let badge = '';
        if (isDone) {
          if (f.sacsResult === 'WIN') badge = `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">WIN ${sacsScore}-${oppScore}</span>`;
          else if (f.sacsResult === 'LOSS') badge = `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-rose-500/20 text-rose-400 border border-rose-500/30">LOSS ${sacsScore}-${oppScore}</span>`;
          else badge = `<span class="px-2 py-0.5 rounded text-[10px] font-black bg-slate-700 text-slate-300">DRAW ${sacsScore}-${oppScore}</span>`;
        }

        return `
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-300">${f.round}</span>
                ${badge}
              </div>
              <span class="text-slate-400 font-medium">Sat ${f.dateStr} • ${f.timeStr}</span>
            </div>

            <div class="space-y-1.5">
              <div class="flex items-center justify-between">
                <span class="text-sm ${sacsIsHome ? 'font-bold text-sky-400' : 'font-medium text-slate-200'}">${f.homeTeam}</span>
                <span class="text-sm font-black ${isDone ? 'text-white' : 'text-slate-600'}">${isDone ? f.homeScore : '-'}</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-sm ${!sacsIsHome ? 'font-bold text-sky-400' : 'font-medium text-slate-200'}">${f.awayTeam}</span>
                <span class="text-sm font-black ${isDone ? 'text-white' : 'text-slate-600'}">${isDone ? f.awayScore : '-'}</span>
              </div>
            </div>

            <div class="pt-2.5 border-t border-slate-800/70 flex items-center justify-between text-xs gap-2">
              <div class="truncate">
                <p class="text-slate-300 font-medium truncate">📍 ${f.court}</p>
                ${f.address ? `<p class="text-[11px] text-slate-500 truncate">${f.address}</p>` : ''}
              </div>
              <div class="flex items-center gap-3 shrink-0">
                <button onclick="shareGameToWhatsApp(${f.idx})" class="text-emerald-400 hover:underline font-semibold">WhatsApp</button>
                ${f.court !== 'Venue TBA' ? `<a href="${getMapsUrl(f.court, f.address)}" target="_blank" class="text-sky-400 hover:underline font-semibold">Maps →</a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 4. Render Division 2 Ladder Table
      const ladderBody = document.getElementById('ladderTableBody');
      ladderBody.innerHTML = currentLadder.map((t, idx) => {
        const isSacs = t.name.toLowerCase().includes('andrew');
        const diffStr = t.diff > 0 ? `+${t.diff}` : `${t.diff}`;
        return `
          <tr class="${isSacs ? 'bg-sky-500/15 font-bold' : 'hover:bg-slate-800/40'}">
            <td class="py-3 pl-3 font-bold ${isSacs ? 'text-sky-400' : 'text-slate-400'}">${idx + 1}</td>
            <td class="py-3 ${isSacs ? 'text-sky-400 font-bold' : 'text-white font-semibold'}">${t.name}</td>
            <td class="py-3 text-center text-slate-300">${t.p}</td>
            <td class="py-3 text-center text-emerald-400 font-semibold">${t.w}</td>
            <td class="py-3 text-center text-rose-400 font-semibold">${t.l}</td>
            <td class="py-3 text-center text-slate-400 text-[11px]">${t.pf}:${t.pa}</td>
            <td class="py-3 text-center ${t.diff > 0 ? 'text-emerald-400' : (t.diff < 0 ? 'text-rose-400' : 'text-slate-400')}">${diffStr}</td>
            <td class="py-3 pr-3 text-right font-black text-white">${t.pts}</td>
          </tr>
        `;
      }).join('');

      // 5. Render All Completed Division 2 Results
      const completedDivMatches = allDivisionFixtures.filter(m => m.status === 'COMPLETED');
      const divContainer = document.getElementById('allDivMatchesContainer');
      if (completedDivMatches.length === 0) {
        divContainer.innerHTML = `<p class="text-xs text-slate-500">No completed matches yet.</p>`;
      } else {
        divContainer.innerHTML = completedDivMatches.map(m => `
          <div class="rounded-xl bg-slate-900/80 border border-slate-800 p-3 flex items-center justify-between text-xs">
            <span class="text-[11px] font-bold text-slate-400 w-16">${m.round}</span>
            <div class="flex-1 flex items-center justify-between px-2">
              <span class="${m.winner === 'HOME' ? 'font-bold text-white' : 'text-slate-400'}">${m.homeTeam}</span>
              <span class="px-2 py-0.5 rounded bg-slate-800 font-black text-sky-400">${m.homeScore} - ${m.awayScore}</span>
              <span class="${m.winner === 'AWAY' ? 'font-bold text-white' : 'text-slate-400'} text-right">${m.awayTeam}</span>
            </div>
          </div>
        `).join('');
      }

      lucide.createIcons();
    }

    loadData();
  </script>
</body>
</html>
