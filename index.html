<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SACS 14A" />
  <title>SACS 14A Basketball • Fixtures & Ladder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen pb-16">

  <!-- Minimalist Clean Header -->
  <header class="sticky top-0 z-30 bg-[#0b0f17]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-sky-600 text-white font-bold flex items-center justify-center text-xs tracking-tight">
        14A
      </div>
      <div>
        <h1 class="font-semibold text-sm leading-tight text-white">St Andrew's 14A</h1>
        <p id="syncStatus" class="text-[10px] text-slate-400">ISA 14s Div 2 • Live</p>
      </div>
    </div>
    <button onclick="shareNextGameToWhatsApp()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-medium text-xs flex items-center gap-1.5 border border-slate-700/60 transition-colors">
      <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
      <span>WhatsApp</span>
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- Segmented View Switcher -->
    <div class="grid grid-cols-2 bg-[#121824] p-1 rounded-xl border border-slate-800/80 text-xs font-semibold">
      <button onclick="switchMainTab('draw')" id="main-tab-draw" class="py-2 rounded-lg bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i> SACS 14A Draw
      </button>
      <button onclick="switchMainTab('ladder')" id="main-tab-ladder" class="py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all">
        <i data-lucide="trophy" class="w-3.5 h-3.5"></i> Div 2 Standings
      </button>
    </div>

    <!-- TAB 1: DRAW & NEXT GAME -->
    <div id="view-draw" class="space-y-4">
      <!-- Season Record Summary Bar -->
      <section id="recordSummary" class="grid grid-cols-3 gap-2"></section>

      <!-- NEXT GAME HERO MODULE -->
      <section id="nextGameHero"></section>

      <!-- SEASON MATCHES SECTION -->
      <section class="space-y-2.5">
        <div class="flex items-center justify-between pt-1">
          <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Match Schedule & Results</h2>
          <div class="flex bg-[#121824] p-0.5 rounded-lg border border-slate-800 text-[11px]">
            <button onclick="setFilter('all')" id="btn-all" class="px-2.5 py-1 rounded-md bg-sky-600 text-white font-medium">All</button>
            <button onclick="setFilter('upcoming')" id="btn-upcoming" class="px-2.5 py-1 rounded-md text-slate-400 font-medium">Upcoming</button>
            <button onclick="setFilter('results')" id="btn-results" class="px-2.5 py-1 rounded-md text-slate-400 font-medium">Results</button>
          </div>
        </div>

        <div id="fixturesContainer" class="space-y-2.5"></div>
      </section>
    </div>

    <!-- TAB 2: STANDINGS TABLE -->
    <div id="view-ladder" class="hidden space-y-4">
      <div class="bg-[#121824] border border-slate-800/80 rounded-xl overflow-hidden">
        <div class="px-4 py-3 bg-[#161f30]/50 border-b border-slate-800/80 flex items-center justify-between">
          <div>
            <h2 class="text-xs font-bold uppercase tracking-wider text-white">Division 2 Standings</h2>
            <p class="text-[10px] text-slate-400">Official ISA Points (W=4, D=2, L=0)</p>
          </div>
          <button onclick="shareLadderToWhatsApp()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-medium text-xs flex items-center gap-1.5 border border-slate-700/60 transition-colors">
            <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
            <span>WhatsApp</span>
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-[#0b0f17]/40 text-slate-400 text-[10px] uppercase border-b border-slate-800/80">
              <tr>
                <th class="py-2.5 pl-3">#</th>
                <th class="py-2.5">Team</th>
                <th class="py-2.5 text-center">P</th>
                <th class="py-2.5 text-center">W</th>
                <th class="py-2.5 text-center">D</th>
                <th class="py-2.5 text-center">L</th>
                <th class="py-2.5 text-center font-bold text-white">PTS</th>
                <th class="py-2.5 pr-3 text-right">AVG</th>
              </tr>
            </thead>
            <tbody id="ladderTableBody" class="divide-y divide-slate-800/50"></tbody>
          </table>
        </div>
      </div>

      <div class="space-y-2.5">
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 pt-1">All Division Results</h3>
        <div id="allDivMatchesContainer" class="space-y-2"></div>
      </div>
    </div>

    <!-- Minimal Footer -->
    <footer class="pt-6 pb-2 text-center flex items-center justify-center gap-4 text-[11px]">
      <a href="https://fixtures.clipboard.app/isa/fixtures?associationSeasonId=e94f3fa0-158f-11f0-ac93-6bf44416c9ad&associationActivityGradeIds=%5B%22711aa164-d787-11ef-bde6-6911b959edfa%22%5D&organisationIds=%5B472%5D&competitionGroupIds=%5B%222bc0fd94-8c12-4bad-ad4f-50585f703c0b%22%5D&round=_all" target="_blank" class="text-slate-500 hover:text-sky-400 transition-colors">
        ISA Fixtures ↗
      </a>
      <span class="text-slate-800">•</span>
      <a href="https://fixtures.clipboard.app/isa/ladder?associationSeasonId=e94f3fa0-158f-11f0-ac93-6bf44416c9ad&associationActivityGradeIds=%5B%22711aa164-d787-11ef-bde6-6911b959edfa%22%5D&competitionGroupIds=%5B%222bc0fd94-8c12-4bad-ad4f-50585f703c0b%22%5D" target="_blank" class="text-slate-500 hover:text-sky-400 transition-colors">
        ISA Standings ↗
      </a>
    </footer>

  </main>

  <script>
    let currentFilter = 'all';
    let allDivisionFixtures = [];
    let sacsFixtures = [];
    let currentLadder = [];

    function switchMainTab(tab) {
      const isDraw = tab === 'draw';
      document.getElementById('view-draw').classList.toggle('hidden', !isDraw);
      document.getElementById('view-ladder').classList.toggle('hidden', isDraw);

      document.getElementById('main-tab-draw').className = isDraw
        ? 'py-2 rounded-lg bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all'
        : 'py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';

      document.getElementById('main-tab-ladder').className = !isDraw
        ? 'py-2 rounded-lg bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all'
        : 'py-2 rounded-lg text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';
    }

    function parseDomFallback(domArray) {
      if (!Array.isArray(domArray)) return [];
      const parsed = [];
      const seenKeys = new Set();

      domArray.forEach(block => {
        if (!block || !block.startsWith('Round ')) return;
        const lines = block.split('\n').map(l => l.trim()).filter(Boolean);

        const round = lines[0];
        const vsIdx = lines.indexOf('vs');
        const calIdx = lines.indexOf('calendar_today');
        const locIdx = lines.indexOf('location_on');

        if (vsIdx === -1 || calIdx === -1) return;

        const homeSchool = lines[3] || 'Home';
        const homeTeamCode = (lines[5] || '').replace(/\s+/g, '');
        const homeTeam = `${homeSchool} ${homeTeamCode}`.trim();

        const awaySchool = lines[vsIdx + 1] || 'Away';
        const awayTeamCode = (lines[vsIdx + 3] || '').replace(/\s+/g, '');
        const awayTeam = `${awaySchool} ${awayTeamCode}`.trim();

        const uniqueKey = `${round}_${homeTeam}_${awayTeam}`;
        if (seenKeys.has(uniqueKey)) return;
        seenKeys.add(uniqueKey);

        const resultLines = lines.slice(vsIdx + 4, calIdx);
        const scoreLine = resultLines[0] || '-';
        const outcomeText = (resultLines[1] || '').toLowerCase();

        let homeScore = null;
        let awayScore = null;
        let status = 'UPCOMING';
        let winner = null;

        const scoreMatch = scoreLine.match(/^(\d+)\s*-\s*(\d+)$/);
        if (scoreMatch) {
          const n1 = parseInt(scoreMatch[1], 10);
          const n2 = parseInt(scoreMatch[2], 10);
          const high = Math.max(n1, n2);
          const low = Math.min(n1, n2);
          status = 'COMPLETED';

          if (n1 === n2 || outcomeText.includes('draw') || outcomeText.includes('tie')) {
            homeScore = n1;
            awayScore = n2;
            winner = 'DRAW';
          } else if (outcomeText.includes('wins')) {
            const homeWon = outcomeText.includes(homeSchool.toLowerCase());
            const awayWon = outcomeText.includes(awaySchool.toLowerCase());
            if (homeWon) {
              homeScore = high;
              awayScore = low;
              winner = 'HOME';
            } else if (awayWon) {
              homeScore = low;
              awayScore = high;
              winner = 'AWAY';
            }
          } else {
            homeScore = n1;
            awayScore = n2;
            winner = homeScore > awayScore ? 'HOME' : 'AWAY';
          }
        }

        const sacsIsHome = homeSchool.toLowerCase().includes('andrew');
        const sacsIsAway = awaySchool.toLowerCase().includes('andrew');
        let sacsResult = null;
        if (status === 'COMPLETED' && (sacsIsHome || sacsIsAway)) {
          if (winner === 'DRAW') sacsResult = 'DRAW';
          else if ((sacsIsHome && winner === 'HOME') || (sacsIsAway && winner === 'AWAY')) sacsResult = 'WIN';
          else sacsResult = 'LOSS';
        }

        const dateStr = lines[calIdx + 1] || '';
        const rawTimeStr = lines[calIdx + 2] || '';
        const timeStr = rawTimeStr === '2:34am' ? 'Time TBA' : rawTimeStr;

        let court = 'Venue TBA';
        let address = '';
        if (locIdx !== -1) {
          const locLines = lines.slice(locIdx + 1);
          if (locLines[0] && locLines[0] !== '-') {
            court = locLines[0];
            if (locLines.length === 2) address = locLines[1];
            else if (locLines.length >= 3) address = locLines.slice(2).join(', ');
          }
        }

        parsed.push({
          round,
          homeSchool,
          awaySchool,
          homeTeam,
          awayTeam,
          homeScore,
          awayScore,
          winner,
          sacsResult,
          outcomeLabel: resultLines[1] || '',
          status,
          dateStr,
          timeStr,
          court,
          address,
          isSacsGame: sacsIsHome || sacsIsAway
        });
      });

      return parsed;
    }

    function parseOfficialDomLadder(domLadderArray) {
      if (!Array.isArray(domLadderArray) || domLadderArray.length === 0) return null;
      const rows = [];
      const seenTeams = new Set();

      domLadderArray.forEach(block => {
        const lines = block.split(/\n|\t/).map(s => s.trim()).filter(Boolean);
        if (lines.length >= 8 && /^\d+$/.test(lines[0])) {
          const rank = parseInt(lines[0], 10);
          const stats = lines.slice(-6);
          if (stats.every(v => /^[\d.]+$/.test(v))) {
            const nameParts = lines.slice(1, lines.length - 6);
            const teamName = nameParts.join(' ').replace(/\s+/g, ' ').trim();
            if (!seenTeams.has(teamName)) {
              seenTeams.add(teamName);
              rows.push({
                rank,
                name: teamName,
                p: parseInt(stats[0], 10),
                w: parseInt(stats[1], 10),
                d: parseInt(stats[2], 10),
                l: parseInt(stats[3], 10),
                pts: parseFloat(stats[4]),
                avg: parseFloat(stats[5])
              });
            }
          }
        }
      });

      return rows.length >= 4 ? rows.sort((a, b) => a.rank - b.rank) : null;
    }

    function buildCalculatedLadder(matches) {
      const teams = {};
      matches.forEach(m => {
        if (!teams[m.homeTeam]) teams[m.homeTeam] = { name: m.homeTeam, p: 0, w: 0, d: 0, l: 0, pts: 0, avg: 0 };
        if (!teams[m.awayTeam]) teams[m.awayTeam] = { name: m.awayTeam, p: 0, w: 0, d: 0, l: 0, pts: 0, avg: 0 };

        if (m.status === 'COMPLETED' && m.homeScore !== null && m.awayScore !== null) {
          const h = teams[m.homeTeam];
          const a = teams[m.awayTeam];
          h.p++; a.p++;
          if (m.winner === 'HOME') { h.w++; h.pts += 4; a.l++; }
          else if (m.winner === 'AWAY') { a.w++; a.pts += 4; h.l++; }
          else { h.d++; h.pts += 2; a.d++; a.pts += 2; }
          h.avg = h.p > 0 ? +(h.pts / h.p).toFixed(2) : 0;
          a.avg = a.p > 0 ? +(a.pts / a.p).toFixed(2) : 0;
        }
      });
      return Object.values(teams)
        .sort((a, b) => b.pts - a.pts || b.w - a.w || a.l - b.l || a.name.localeCompare(b.name))
        .map((t, idx) => ({ ...t, rank: idx + 1 }));
    }

    function getMapsUrl(court, address) {
      const query = address || (court !== 'Venue TBA' ? `${court} NSW` : 'Sydney NSW');
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    async function loadData() {
      try {
        const res = await fetch('./sacs-14a.json?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.updatedAt) {
            const dt = new Date(data.updatedAt);
            document.getElementById('syncStatus').innerText = `Synced ${dt.toLocaleDateString('en-AU', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
          }
          if (data.domFallback) {
            allDivisionFixtures = parseDomFallback(data.domFallback);
            sacsFixtures = allDivisionFixtures.filter(f => f.isSacsGame);
          }
          const officialLadder = parseOfficialDomLadder(data.domLadder);
          currentLadder = officialLadder || buildCalculatedLadder(allDivisionFixtures);
        }
      } catch (e) {
        console.error('Error loading data:', e);
      }
      render();
    }

    function getNextGame() {
      return sacsFixtures.find(f => f.status !== 'COMPLETED') || sacsFixtures[sacsFixtures.length - 1];
    }

    function formatWhatsAppText(game) {
      const mapsLink = getMapsUrl(game.court, game.address);
      const appUrl = window.location.href.split('?')[0];

      if (game.status === 'COMPLETED') {
        return `🏀 *SACS 14A Result (${game.round})*\n*${game.homeTeam}* ${game.homeScore} – ${game.awayScore} *${game.awayTeam}*\n\n📅 Full draw & Standings:\n${appUrl}`;
      }

      let locText = `📍 ${game.court}`;
      if (game.address) locText += `\n🗺️ ${game.address}\n🚗 Maps: ${mapsLink}`;

      return `🏀 *SACS 14A Basketball – ${game.round}*\n📅 Sat ${game.dateStr} @ ${game.timeStr}\n🆚 ${game.homeTeam} vs ${game.awayTeam}\n${locText}\n\n🔗 ${appUrl}`;
    }

    function shareGameToWhatsApp(idx) {
      const game = sacsFixtures[idx];
      if (!game) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(formatWhatsAppText(game))}`, '_blank');
    }

    function shareNextGameToWhatsApp() {
      const next = getNextGame();
      if (!next) return;
      window.open(`https://wa.me/?text=${encodeURIComponent(formatWhatsAppText(next))}`, '_blank');
    }

    function shareLadderToWhatsApp() {
      const appUrl = window.location.href.split('?')[0];
      const lines = currentLadder.map(t => `${t.rank}. *${t.name}* — ${t.pts}pts (${t.w}W-${t.l}L)`);
      window.open(`https://wa.me/?text=${encodeURIComponent(`🏆 *ISA 14s Div 2 Standings*\n\n${lines.join('\n')}\n\n🔗 ${appUrl}`)}`, '_blank');
    }

    function setFilter(f) {
      currentFilter = f;
      ['all', 'upcoming', 'results'].forEach(k => {
        const btn = document.getElementById('btn-' + k);
        btn.className = k === f
          ? 'px-2.5 py-1 rounded-md bg-sky-600 text-white font-medium'
          : 'px-2.5 py-1 rounded-md text-slate-400 font-medium';
      });
      render();
    }

    function render() {
      let wins = 0, losses = 0, played = 0;
      sacsFixtures.forEach(f => {
        if (f.status === 'COMPLETED') {
          played++;
          if (f.sacsResult === 'WIN') wins++;
          else if (f.sacsResult === 'LOSS') losses++;
        }
      });

      document.getElementById('recordSummary').innerHTML = `
        <div class="bg-[#121824] border border-slate-800/80 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-slate-400 font-medium">Played</p>
          <p class="text-base font-bold text-white tabular-nums">${played}</p>
        </div>
        <div class="bg-[#121824] border border-slate-800/80 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-slate-400 font-medium">Won</p>
          <p class="text-base font-bold text-emerald-400 tabular-nums">${wins}</p>
        </div>
        <div class="bg-[#121824] border border-slate-800/80 rounded-xl p-2.5 text-center">
          <p class="text-[10px] uppercase text-slate-400 font-medium">Lost</p>
          <p class="text-base font-bold text-rose-400 tabular-nums">${losses}</p>
        </div>
      `;

      const next = getNextGame();
      const hero = document.getElementById('nextGameHero');

      if (next) {
        const sacsIsHome = next.homeTeam.toLowerCase().includes('andrew');
        hero.innerHTML = `
          <div class="rounded-xl bg-[#121824] border border-sky-600/30 p-4 space-y-3.5 shadow-sm">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-bold text-sky-400 uppercase tracking-wider">Next Match • ${next.round}</span>
              <span class="text-slate-400 font-medium">Sat ${next.dateStr} • ${next.timeStr}</span>
            </div>

            <div class="grid grid-cols-7 items-center text-center py-0.5">
              <div class="col-span-3">
                <p class="font-semibold text-sm ${sacsIsHome ? 'text-sky-400' : 'text-white'} leading-snug">${next.homeTeam}</p>
                <span class="text-[9px] text-slate-500 uppercase tracking-widest">Home</span>
              </div>
              <div class="col-span-1 text-[10px] font-bold text-slate-600">VS</div>
              <div class="col-span-3">
                <p class="font-semibold text-sm ${!sacsIsHome ? 'text-sky-400' : 'text-white'} leading-snug">${next.awayTeam}</p>
                <span class="text-[9px] text-slate-500 uppercase tracking-widest">Away</span>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between gap-3 text-xs">
              <div class="truncate">
                <p class="font-medium text-slate-200 truncate">${next.court}</p>
                ${next.address ? `<p class="text-[10px] text-slate-400 truncate">${next.address}</p>` : ''}
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="shareNextGameToWhatsApp()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-400 font-medium text-xs flex items-center gap-1 border border-slate-700/60 transition-colors">
                  <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> WhatsApp
                </button>
                <a href="${getMapsUrl(next.court, next.address)}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium text-xs transition-colors">
                  Maps
                </a>
              </div>
            </div>
          </div>
        `;
      }

      const listContainer = document.getElementById('fixturesContainer');
      const filtered = sacsFixtures.map((f, idx) => ({ ...f, idx })).filter(f => {
        if (currentFilter === 'upcoming') return f.status !== 'COMPLETED';
        if (currentFilter === 'results') return f.status === 'COMPLETED';
        return true;
      });

      listContainer.innerHTML = filtered.map(f => {
        const isDone = f.status === 'COMPLETED';
        const sacsIsHome = f.homeTeam.toLowerCase().includes('andrew');
        const sacsScore = sacsIsHome ? f.homeScore : f.awayScore;
        const oppScore = sacsIsHome ? f.awayScore : f.homeScore;

        let badge = '';
        if (isDone) {
          if (f.sacsResult === 'WIN') badge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">WIN ${sacsScore}-${oppScore}</span>`;
          else if (f.sacsResult === 'LOSS') badge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">LOSS ${sacsScore}-${oppScore}</span>`;
          else badge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-slate-800 text-slate-300">DRAW ${sacsScore}-${oppScore}</span>`;
        }

        return `
          <div class="rounded-xl bg-[#121824] border border-slate-800/80 p-3.5 space-y-2.5">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-slate-300">${f.round}</span>
                ${badge}
              </div>
              <span class="text-slate-400 text-[11px]">Sat ${f.dateStr} • ${f.timeStr}</span>
            </div>

            <div class="space-y-1">
              <div class="flex items-center justify-between text-xs">
                <span class="${sacsIsHome ? 'font-semibold text-sky-400' : 'text-slate-300'}">${f.homeTeam}</span>
                <span class="font-bold tabular-nums ${isDone ? 'text-white' : 'text-slate-600'}">${isDone ? f.homeScore : '-'}</span>
              </div>
              <div class="flex items-center justify-between text-xs">
                <span class="${!sacsIsHome ? 'font-semibold text-sky-400' : 'text-slate-300'}">${f.awayTeam}</span>
                <span class="font-bold tabular-nums ${isDone ? 'text-white' : 'text-slate-600'}">${isDone ? f.awayScore : '-'}</span>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800/60 flex items-center justify-between text-xs gap-2">
              <span class="text-slate-400 text-[11px] truncate">📍 ${f.court}</span>
              <div class="flex items-center gap-3 shrink-0">
                <button onclick="shareGameToWhatsApp(${f.idx})" class="text-emerald-400 hover:underline font-medium text-[11px] flex items-center gap-1">
                  <i data-lucide="message-circle" class="w-3 h-3"></i> WhatsApp
                </button>
                ${f.court !== 'Venue TBA' ? `<a href="${getMapsUrl(f.court, f.address)}" target="_blank" class="text-sky-400 hover:underline font-medium text-[11px]">Maps ↗</a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      const ladderBody = document.getElementById('ladderTableBody');
      ladderBody.innerHTML = currentLadder.map(t => {
        const isSacs = t.name.toLowerCase().includes('andrew');
        return `
          <tr class="${isSacs ? 'bg-sky-600/10 font-medium' : 'hover:bg-slate-800/30'}">
            <td class="py-2.5 pl-3 ${isSacs ? 'text-sky-400 font-bold' : 'text-slate-400'}">${t.rank}</td>
            <td class="py-2.5 ${isSacs ? 'text-sky-400 font-bold' : 'text-white'}">${t.name}</td>
            <td class="py-2.5 text-center text-slate-300 tabular-nums">${t.p}</td>
            <td class="py-2.5 text-center text-emerald-400 tabular-nums">${t.w}</td>
            <td class="py-2.5 text-center text-slate-400 tabular-nums">${t.d}</td>
            <td class="py-2.5 text-center text-rose-400 tabular-nums">${t.l}</td>
            <td class="py-2.5 text-center font-bold text-white tabular-nums">${t.pts}</td>
            <td class="py-2.5 pr-3 text-right text-slate-400 tabular-nums">${t.avg}</td>
          </tr>
        `;
      }).join('');

      const completedDivMatches = allDivisionFixtures.filter(m => m.status === 'COMPLETED');
      const divContainer = document.getElementById('allDivMatchesContainer');
      if (completedDivMatches.length === 0) {
        divContainer.innerHTML = `<p class="text-xs text-slate-500">No completed matches yet.</p>`;
      } else {
        divContainer.innerHTML = completedDivMatches.map(m => `
          <div class="rounded-lg bg-[#121824] border border-slate-800/80 p-2.5 flex items-center justify-between text-xs">
            <span class="text-[10px] font-bold text-slate-400 w-14">${m.round}</span>
            <div class="flex-1 flex items-center justify-between px-2">
              <span class="${m.winner === 'HOME' ? 'font-semibold text-white' : 'text-slate-400'}">${m.homeTeam}</span>
              <span class="px-2 py-0.5 rounded bg-slate-800 font-bold text-sky-400 tabular-nums">${m.homeScore} - ${m.awayScore}</span>
              <span class="${m.winner === 'AWAY' ? 'font-semibold text-white' : 'text-slate-400'} text-right">${m.awayTeam}</span>
            </div>
          </div>
        `).join('');
      }

      lucide.createIcons();
    }

    loadData();
  </script>
</body>
</html>
